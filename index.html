<style>
  :root{
    --canopy:#1F3D2B;
    --canopy-deep:#132A1D;
    --soil:#4A3221;
    --gold:#C9A227;
    --paper:#EFE7D8;
    --paper-warm:#F5EFE1;
    --ink:#14201A;
    --river:#2E5C6E;
    --line: rgba(20,32,26,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--canopy-deep);
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--soil);
    display:flex;
    align-items:center;
    gap:0.6rem;
  }
  .eyebrow::before{
    content:'';
    width:22px; height:1px;
    background:var(--gold);
  }
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 6vw;}

  /* NAV */
  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(239,231,216,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:1.1rem; padding-bottom:1.1rem;
  }
  .brand{
    font-family:'Fraunces', serif; font-weight:700; font-size:1.15rem;
    letter-spacing:-0.01em;
    display:flex; align-items:center; gap:0.55rem;
    text-decoration:none; color:inherit;
  }
  .brand-mark{ width:34px; height:34px; flex:0 0 auto; }
  .brand-afrika{color:var(--gold);}
  .brand-text{ display:flex; flex-direction:column; line-height:1; }
  .brand-name{ font-size:1.15rem; }
  .brand-sub{
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    font-weight:400; font-size:0.6rem;
    letter-spacing:0.22em; text-transform:uppercase;
    color:var(--soil); margin-top:0.28rem;
  }
  .navlinks{display:flex; gap:2rem; font-size:0.85rem;}
  .navlinks a{text-decoration:none; opacity:0.75; transition:opacity 0.2s;}
  .navlinks a:hover{opacity:1;}
  .nav-cta{
    font-size:0.8rem; font-weight:500;
    background:var(--canopy); color:var(--paper-warm);
    padding:0.55rem 1.1rem; border-radius:2px;
    text-decoration:none;
  }
  /* Mobile menu — the nav used to hide every link below 760px with nothing to
     replace it, leaving only the brand and the CTA on a phone. */
  .nav-toggle{
    display:none;
    width:44px; height:44px;
    align-items:center; justify-content:center;
    background:none; border:1px solid var(--line); border-radius:2px;
    color:var(--canopy); cursor:pointer;
  }
  .nav-toggle:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .nav-toggle svg{ width:20px; height:20px; }
  .nav-toggle .icon-close{ display:none; }
  .nav-toggle[aria-expanded="true"] .icon-open{ display:none; }
  .nav-toggle[aria-expanded="true"] .icon-close{ display:block; }

  @media(max-width:880px){
    nav .wrap{ flex-wrap:wrap; row-gap:0; }
    .nav-toggle{ display:flex; order:2; margin-left:auto; }
    .nav-cta{ order:3; margin-left:0.75rem; min-height:44px; display:inline-flex; align-items:center; }
    .navlinks{
      order:4;
      display:none;
      flex-direction:column; gap:0;
      width:100%;
      border-top:1px solid var(--line);
      margin-top:1.1rem;
      font-size:1rem;
    }
    .navlinks.open{ display:flex; }
    .navlinks a{
      padding:0.95rem 0;
      min-height:44px; display:flex; align-items:center;
      border-bottom:1px solid var(--line);
      opacity:1;
    }
    .navlinks a:last-child{ border-bottom:none; }
  }
  @media(max-width:420px){
    .nav-cta{ font-size:0.75rem; padding:0.55rem 0.8rem; }
  }

  /* HERO */
  .hero{
    position:relative;
    padding:8rem 0 6rem;
    overflow:hidden;
    background:
      radial-gradient(ellipse 900px 500px at 82% -10%, rgba(201,162,39,0.16), transparent 60%),
      var(--paper);
  }
  .hero-rings{
    position:absolute; right:-120px; top:-80px;
    width:520px; height:520px;
    opacity:0.5;
    pointer-events:none;
  }
  .hero-mark{
    width:112px; height:112px;
    position:relative; z-index:2;
    margin-bottom:1.6rem;
  }
  .hero h1{
    font-size:clamp(2.4rem, 5.4vw, 4.1rem);
    line-height:1.06;
    max-width:14ch;
    position:relative; z-index:2;
  }
  .hero h1 em{
    font-style:italic; color:var(--gold);
  }
  .hero-sub{
    max-width:46ch;
    margin-top:1.6rem;
    font-size:1.08rem;
    color:var(--soil);
    position:relative; z-index:2;
  }
  .hero-ctas{
    margin-top:2.4rem;
    display:flex; gap:1rem; flex-wrap:wrap;
    position:relative; z-index:2;
  }
  .btn-primary{
    background:var(--canopy); color:var(--paper-warm);
    padding:0.95rem 1.7rem; border-radius:2px;
    font-weight:500; font-size:0.92rem;
    text-decoration:none; display:inline-block;
    border:1px solid var(--canopy);
    transition:transform 0.15s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-ghost{
    padding:0.95rem 1.7rem; border-radius:2px;
    font-weight:500; font-size:0.92rem;
    text-decoration:none; display:inline-block;
    border:1px solid var(--soil); color:var(--soil);
    transition:transform 0.15s ease;
  }
  .btn-ghost:hover{transform:translateY(-2px);}

  .stat-row{
    margin-top:4.5rem;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:2rem;
    border-top:1px solid var(--line);
    padding-top:2.2rem;
    position:relative; z-index:2;
  }
  .stat-row div .n{
    font-family:'IBM Plex Mono',monospace; font-size:1.7rem; color:var(--canopy-deep); font-weight:500;
  }
  .stat-row div .l{
    font-size:0.78rem; color:var(--soil); margin-top:0.2rem;
  }
  @media(max-width:700px){ .stat-row{grid-template-columns:1fr; gap:1.4rem;} .hero{padding:6.5rem 0 4rem;} }

  /* SECTION generic */
  section{padding:6rem 0;}
  .section-head{max-width:640px; margin-bottom:3rem;}
  .section-head h2{font-size:clamp(1.7rem,3.2vw,2.4rem); margin-top:0.9rem;}
  .section-head p{color:var(--soil); margin-top:1rem; font-size:1.02rem;}

  /* MODEL */
  .model{background:var(--paper-warm); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .model-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:3rem;
  }
  .model-card h3{font-size:1.3rem; margin-bottom:0.7rem;}
  .model-card p{color:var(--soil); font-size:0.98rem;}
  .model-card .tag{
    font-family:'IBM Plex Mono',monospace; font-size:0.7rem;
    letter-spacing:0.08em; text-transform:uppercase;
    color:var(--gold); margin-bottom:0.8rem; display:block;
  }
  @media(max-width:760px){ .model-grid{grid-template-columns:1fr;} }

  /* PATH — signature element */
  .path-diagram{
    display:flex; flex-direction:column; gap:0;
    margin-top:1rem;
    border-left:2px solid var(--line);
    padding-left:0;
  }
  .path-step{
    display:grid; grid-template-columns:64px 1fr; gap:1.4rem;
    padding:1.9rem 0;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .path-step:last-child{border-bottom:none;}
  .ring{
    width:56px; height:56px;
    border-radius:50%;
    border:1.5px solid var(--canopy);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:0.85rem;
    color:var(--canopy-deep); background:var(--paper);
    position:relative;
  }
  .ring::before{
    content:'';
    position:absolute; inset:8px;
    border-radius:50%;
    border:1px solid rgba(31,61,43,0.35);
  }
  .path-step h4{
    font-family:'Fraunces',serif; font-weight:600; font-size:1.15rem; color:var(--canopy-deep);
  }
  .path-step p{color:var(--soil); font-size:0.95rem; margin-top:0.35rem; max-width:56ch;}
  .path-step .target{
    font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--river);
    margin-top:0.5rem; display:inline-block;
  }

  /* FOUNDERS */
  .founders-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:2.2rem;
  }
  .founder-card{
    border:1px solid var(--line); padding:1.8rem;
    background:var(--paper-warm);
  }
  .founder-card .initial{
    width:44px; height:44px; border-radius:50%;
    background:var(--canopy); color:var(--paper-warm);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600;
    margin-bottom:1rem;
  }
  .founder-card h4{font-family:'Fraunces',serif; font-size:1.1rem; color:var(--canopy-deep);}
  .founder-card .role{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--gold);
    text-transform:uppercase; letter-spacing:0.06em; margin:0.3rem 0 0.8rem;
  }
  .founder-card .bio{font-size:0.9rem; color:var(--soil);}
  .placeholder{
    font-style:italic; color:rgba(74,50,33,0.55); font-size:0.85rem;
  }
  @media(max-width:760px){ .founders-grid{grid-template-columns:1fr;} }

  /* CTA / DONATE */
  .cta-band{
    background:var(--canopy-deep); color:var(--paper-warm);
  }
  .cta-band .wrap{
    display:flex; align-items:center; justify-content:space-between; gap:2rem; flex-wrap:wrap;
    padding:4.5rem 6vw;
  }
  .cta-band h2{color:var(--paper-warm); font-size:clamp(1.6rem,3vw,2.1rem); max-width:20ch;}
  .cta-band .btn-primary{background:var(--gold); border-color:var(--gold); color:var(--canopy-deep); font-weight:600;}

  .footer-brand{ display:flex; align-items:center; gap:0.6rem; }
  .footer-mark{ width:30px; height:30px; flex:0 0 auto; }
  footer{
    padding:3rem 0 4rem;
    font-size:0.82rem; color:var(--soil);
  }
  footer .wrap{display:flex; justify-content:space-between; flex-wrap:wrap; gap:1rem;}

  .reveal{opacity:0; transform:translateY(16px); transition:opacity 0.6s ease, transform 0.6s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}

  @media(prefers-reduced-motion: reduce){
    .reveal{opacity:1; transform:none; transition:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
